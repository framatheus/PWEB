<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14 - PWEB</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Atividade 14 - PWEB</h1>

        <div class="campo">
            <label for="texto">Digite um texto:</label>
            <input type="text" id="texto" placeholder="Digite uma palavra ou frase">
        </div>

        <div class="opcoes">
            <div>
                <input type="radio" id="maiuscula" name="tipoTexto">
                <label for="maiuscula">Transformar em letras maiúsculas</label>
            </div>

            <div>
                <input type="radio" id="minuscula" name="tipoTexto">
                <label for="minuscula">Transformar em letras minúsculas</label>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
