<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Conteúdo - Kanban</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="form">
  <a class="skip-link" href="#formConteudo">Pular para o formulário</a>

  <header class="app-header form-header">
    <a class="btn btn-ghost" href="index.html">Voltar ao board</a>
    <div class="form-title">
      <h1 id="formHeading">Novo conteúdo de estudo</h1>
    </div>
    <span class="badge badge-purple">Conteúdo para estudar</span>
  </header>

  <main class="container form-container">
    <form id="formConteudo" class="card-form" novalidate>
      <input type="hidden" id="contentId" />

      <fieldset>
        <legend>Informações básicas</legend>

        <div class="field">
          <label for="titulo">Título <span aria-hidden="true">*</span></label>
          <input
            id="titulo"
            name="titulo"
            type="text"
            maxlength="80"
            placeholder="Ex.: Cálculo Diferencial — Limites"
            required
          />
        </div>

        <div class="field">
          <label for="descricao">Descrição <span aria-hidden="true">*</span></label>
          <textarea
            id="descricao"
            name="descricao"
            rows="5"
            maxlength="350"
            placeholder="Descreva o conteúdo, objetivo de estudo, material e observações."
            required
          ></textarea>
          <small>Inclua materiais, metas ou exercícios planejados.</small>
        </div>
      </fieldset>

      <fieldset>
        <legend>Planejamento</legend>

        <div class="form-grid">
          <div class="field">
            <span class="label-text">Prioridade <span aria-hidden="true">*</span></span>
            <div class="segmented" role="radiogroup" aria-label="Prioridade">
              <label class="choice choice-high">
                <input type="radio" name="prioridade" value="Alta" required />
                <span>Alta</span>
              </label>
              <label class="choice choice-medium">
                <input type="radio" name="prioridade" value="Média" />
                <span>Média</span>
              </label>
              <label class="choice choice-low">
                <input type="radio" name="prioridade" value="Baixa" />
                <span>Baixa</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label for="vencimento">Data de vencimento <span aria-hidden="true">*</span></label>
            <input id="vencimento" name="vencimento" type="date" required />
          </div>
        </div>

        <div class="field">
          <label for="responsaveis">Responsáveis <span aria-hidden="true">*</span></label>
          <input
            id="responsaveis"
            name="responsaveis"
            type="text"
            maxlength="120"
            placeholder="Ex.: João H., Matheus F."
            required
          />
          <small>Separe os nomes com vírgula quando houver mais de um responsável.</small>
        </div>
      </fieldset>

      <fieldset>
        <legend>Status no board</legend>

        <div class="segmented status-options" role="radiogroup" aria-label="Status no Kanban">
          <label class="choice">
            <input type="radio" name="status" value="Conteúdo para estudar" required />
            <span>Conteúdo para estudar</span>
          </label>
          <label class="choice">
            <input type="radio" name="status" value="Em Progresso" />
            <span>Em progresso</span>
          </label>
          <label class="choice">
            <input type="radio" name="status" value="Concluído" />
            <span>Concluído</span>
          </label>
        </div>
      </fieldset>

      <p id="formMessage" class="form-message" role="alert" aria-live="assertive"></p>

      <div class="form-actions">
        <button id="deleteBtn" class="btn btn-danger" type="button">Excluir</button>
        <div class="actions-right">
          <a class="btn btn-secondary" href="index.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar conteúdo</button>
        </div>
      </div>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
